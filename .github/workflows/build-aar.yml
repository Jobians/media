name: Build AndroidX Media AARs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Show only local Media project dependencies
      - name: Check Media Module Dependencies
        run: |
          echo "===== lib-exoplayer ====="
          ./gradlew :lib-exoplayer:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

          echo ""
          echo "===== lib-exoplayer-rtsp ====="
          ./gradlew :lib-exoplayer-rtsp:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

          echo ""
          echo "===== lib-extractor ====="
          ./gradlew :lib-extractor:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

          echo ""
          echo "===== lib-ui ====="
          ./gradlew :lib-ui:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

      - name: Build Targeted Modules
        run: |
          ./gradlew \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-ui:assembleRelease \
            --no-daemon \
            --parallel

      - name: List Built AARs
        run: |
          echo "===== Built AARs ====="
          find . -type f -path '*/build/outputs/aar/*.aar' -print

      - name: Upload Built AARs
        uses: actions/upload-artifact@v4
        with:
          name: androidx-media-aars
          path: '**/build/outputs/aar/*.aar'
          retention-days: 7
