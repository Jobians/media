name: Build AndroidX Media AARs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Check Media Module Dependencies
        run: |
          for module in \
            lib-exoplayer \
            lib-exoplayer-rtsp \
            lib-extractor \
            lib-ui
          do
            echo "========================================"
            echo "$module dependencies"
            echo "========================================"

            ./gradlew ":$module:dependencies" \
              --configuration releaseCompileClasspath \
              --no-daemon \
              | grep -E -- 'project :lib-' || true

            echo ""
          done

      - name: Build All Required Media AARs
        run: |
          ./gradlew \
            :lib-common:assembleRelease \
            :lib-container:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-database:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-ui:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Show Generated AARs
        run: |
          echo "===== Generated AAR files ====="

          find libraries \
            -type f \
            -name '*.aar' \
            -print \
            | sort

      - name: Package Media AARs
        run: |
          rm -rf media-libs
          mkdir -p media-libs

          find libraries \
            -type f \
            -name '*.aar' \
            -exec cp {} media-libs/ \;

      - name: Verify Media AAR Package
        run: |
          echo "===== Packaged Media AARs ====="

          find media-libs \
            -maxdepth 1 \
            -type f \
            -name '*.aar' \
            -printf '%f\n' \
            | sort

          echo ""
          echo "===== AAR count ====="

          count=$(find media-libs \
            -maxdepth 1 \
            -type f \
            -name '*.aar' \
            | wc -l)

          echo "Found $count AAR(s)"

          if [ "$count" -ne 9 ]; then
            echo "ERROR: Expected exactly 9 AARs, but found $count."
            exit 1
          fi

          echo ""
          echo "===== Package contents ====="
          ls -lh media-libs/

      - name: Upload Media AAR Package
        uses: actions/upload-artifact@v4
        with:
          name: media-libs
          path: media-libs/
          retention-days: 7
