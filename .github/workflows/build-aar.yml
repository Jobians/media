name: Build AndroidX Media AARs

on:
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment (AndroidX Media requires Java 17+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Grant execute permissions to the Gradle Wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Inspect release dependencies before building
      - name: Check Release Dependencies
        run: |
          echo "===== lib-exoplayer releaseCompileClasspath ====="
          ./gradlew :lib-exoplayer:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon

          echo ""
          echo "===== lib-exoplayer-rtsp releaseCompileClasspath ====="
          ./gradlew :lib-exoplayer-rtsp:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon

          echo ""
          echo "===== lib-extractor releaseCompileClasspath ====="
          ./gradlew :lib-extractor:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon

          echo ""
          echo "===== lib-ui releaseCompileClasspath ====="
          ./gradlew :lib-ui:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon

      # 5. Build the release AARs
      - name: Build Targeted Modules
        run: |
          ./gradlew \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-ui:assembleRelease \
            --no-daemon \
            --parallel

      # 6. List generated AAR files
      - name: List Built AARs
        run: |
          echo "===== Generated AAR files ====="
          find . -type f -path '*/build/outputs/aar/*.aar' -print

      # 7. Collect and upload the built AAR files as an artifact
      - name: Upload Built AARs
        uses: actions/upload-artifact@v4
        with:
          name: androidx-media-aars
          path: '**/build/outputs/aar/*.aar'
          retention-days: 7
