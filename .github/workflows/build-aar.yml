name: Build AndroidX Media AARs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Show the dependency graph
      - name: Check Media Module Dependencies
        run: |
          echo "===== lib-exoplayer ====="
          ./gradlew :lib-exoplayer:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

          echo ""
          echo "===== lib-exoplayer-rtsp ====="
          ./gradlew :lib-exoplayer-rtsp:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

          echo ""
          echo "===== lib-extractor ====="
          ./gradlew :lib-extractor:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

          echo ""
          echo "===== lib-ui ====="
          ./gradlew :lib-ui:dependencies \
            --configuration releaseCompileClasspath \
            --no-daemon \
            | grep -E -- 'project :lib-' || true

      # Build every local AAR required by the target modules
      - name: Build All Required Media AARs
        run: |
          ./gradlew \
            :lib-common:assembleRelease \
            :lib-container:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-database:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-ui:assembleRelease \
            --no-daemon \
            --parallel

      # Show exactly what was generated
      - name: List Built AARs
        run: |
          echo "===== Built AARs ====="
          find . -type f -path '*/build/outputs/aar/*.aar' -print

      # Upload all generated AARs
      - name: Upload Built AARs
        uses: actions/upload-artifact@v4
        with:
          name: androidx-media-aars
          path: '**/build/outputs/aar/*.aar'
