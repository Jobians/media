name: Build AndroidX Media AARs

on:
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java Environment (AndroidX Media requires Java 17+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Grant execute permissions to the Gradle Wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Compile the modules and build the release AARs
      - name: Build Targeted Modules
        run: |
          ./gradlew \
            :lib-exoplayer:assembleReleaseDependencies \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-rtsp:assembleReleaseDependencies \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-extractor:assembleReleaseDependencies \
            :lib-extractor:assembleRelease \
            :lib-ui:assembleReleaseDependencies \
            :lib-ui:assembleRelease \
            --no-daemon \
            --parallel

      # 5. Collect and upload the built AAR files as an artifact
      - name: Upload Built AARs
        uses: actions/upload-artifact@v4
        with:
          name: androidx-media-aars
          path: libraries/**/*.aar
          retention-days: 7
